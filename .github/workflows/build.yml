name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:

jobs:
  # Each architecture builds and scans natively on its own runner (no QEMU)
  # and pushes an untagged per-architecture image; merge joins them by digest
  # and applies the only tags: latest and <sha>-<date>.
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      BUILD_ARGS: |
        JAVA_VERSION=${{ matrix.java }}
        CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
      CACHE_SCOPE: java-${{ matrix.java }}-${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=${RAW_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          RAW_NAME: ghcr.io/${{ github.repository }}-${{ matrix.java }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ env.BUILD_ARGS }}
          pull: true
          load: true
          tags: local/scan-${{ matrix.java }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Vulnerability gate (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/scan-${{ matrix.java }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ env.BUILD_ARGS }}
          pull: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Export digest
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: steps.push.outputs.digest != ''
        with:
          name: digests-${{ matrix.java }}-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    # Run even when another matrix cell failed; a variant missing an
    # architecture fails its own merge below instead of blocking the rest.
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.java }}-*
          path: digests
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        env:
          NAME: ghcr.io/${{ github.repository }}-${{ matrix.java }}
        run: |
          set -euo pipefail
          image="${NAME,,}"
          tags=("${image}:${GITHUB_SHA::7}-$(date -u +%d%m%Y)" "${image}:latest")
          sources=()
          for file in digests/*; do
            sources+=("${image}@sha256:${file##*/}")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]/#/--tag=}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      - uses: anchore/sbom-action/download-syft@v0

      - name: Sign image and attest SBOM
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          platform_digests="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
            jq -r '.manifests[] | select(.platform.os == "linux") | .digest')"
          for digest in ${platform_digests}; do
            syft "${IMAGE}@${digest}" -o spdx-json=sbom.spdx.json
            cosign attest --yes \
              --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${digest}"
            cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${digest}"
          done
          cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}@${DIGEST}"
